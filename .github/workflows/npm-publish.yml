name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        run: >-
          node -e "const version=require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== 'v'+version)
          throw new Error('Release tag must be v'+version)"
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
      - name: Check published version
        id: published_version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"

          if [[ "${published_version}" == "${package_version}" ]]; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
            echo "${package_name}@${package_version} is already published."
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish package
        if: steps.published_version.outputs.already_published != 'true'
        run: npm publish
